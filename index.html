<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Lingora data collection</title>
<style>
:root{--bg:#F3F6F5;--panel:#fff;--ink:#14231F;--muted:#4C5C57;--line:#C5D1CD;--accent:#0B5C55;--accent-ink:#fff;--warn:#7A4B00;--warn-bg:#FFF1D6;--err:#9B2226;--ok:#1B6B3A}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A17;--panel:#16251F;--ink:#E7F0ED;--muted:#9FB2AC;--line:#2A3B36;--accent:#4FB8AC;--accent-ink:#06211D;--warn:#F2C879;--warn-bg:#33270F;--err:#FF9B9B;--ok:#7FD99B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{max-width:1100px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:820px){main{grid-template-columns:1fr}}
h1{font-size:1.35rem;margin:0}h2{font-size:1.05rem;margin:0 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:6px}
.top select{width:auto;min-width:130px}
.lead{color:var(--muted);margin:0 0 12px;max-width:62ch}
.stage{position:relative;background:#0b1512;border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:520px;margin:0 auto}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1)}
.stage .msg{position:absolute;left:8px;bottom:8px;right:8px;color:#E7F0ED;font-size:.9rem;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:12px 0}
.check input{width:24px;height:24px;margin-top:2px;flex:none}
button{min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:var(--panel);color:var(--accent);font:600 1rem system-ui,sans-serif;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.note{border-left:4px solid var(--warn);background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:6px;font-size:.92rem;margin:12px 0}
#status{min-height:1.5em;margin:8px 0 0;font-weight:600}#status.warn{color:var(--warn)}#status.err{color:var(--err)}#status.ok{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.hint{color:var(--muted);font-size:.92rem;margin:6px 0 0}
</style>
</head>
<body>
<main>
<section class="panel" aria-labelledby="h-cam">
  <div class="top"><h1 id="h-cam" data-i18n="appTitle"></h1><select id="lang" aria-label="Language / Язык / Til"></select></div>
  <p class="lead" data-i18n="lead"></p>
  <div class="stage" id="stage"><video id="video" playsinline muted></video><canvas id="overlay"></canvas><div class="msg" id="stageMsg"></div></div>
  <div class="actions">
    <button id="startBtn" class="primary" data-i18n="btnStart"></button>
    <button id="recBtn" disabled data-i18n="btnRecord"></button>
    <button id="undoBtn" disabled data-i18n="btnUndo"></button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
</section>

<section class="panel" aria-labelledby="h-set">
  <h2 id="h-set" data-i18n="session"></h2>
  <label class="check"><input type="checkbox" id="consent"><span data-i18n="consent"></span></label>
  <div class="row">
    <div><label for="signer" data-i18n="signerCode"></label><input type="text" id="signer" placeholder="S01" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false"><p class="hint" data-i18n="signerHint"></p></div>
    <div><label for="signerType" data-i18n="signerType"></label><select id="signerType"><option value="native_deaf" data-i18n="tNative"></option><option value="hearing_learner" data-i18n="tHearing" selected></option><option value="other" data-i18n="tOther"></option></select></div>
  </div>
  <label for="sign" data-i18n="signToRecord"></label>
  <select id="sign"></select>
  <p class="hint" id="signHint"></p>
  <p class="note" id="signsWarn" data-i18n="signsMissing" hidden></p>
  <div class="row">
    <div><label for="lighting" data-i18n="lighting"></label><select id="lighting"><option value="normal" data-i18n="lNormal"></option><option value="bright" data-i18n="lBright"></option><option value="dim" data-i18n="lDim"></option><option value="backlit" data-i18n="lBacklit"></option></select></div>
    <div><label for="distance" data-i18n="distance"></label><select id="distance"><option value="mid" data-i18n="dMid"></option><option value="near" data-i18n="dNear"></option><option value="far" data-i18n="dFar"></option></select></div>
  </div>
  <label for="device" data-i18n="device"></label>
  <input type="text" id="device" data-i18n-ph="devicePh" maxlength="60">
  <p class="note" data-i18n="note"></p>

  <h2 data-i18n="collected"></h2>
  <table><thead><tr><th data-i18n="thSign"></th><th data-i18n="thFrames"></th><th data-i18n="thBy"></th></tr></thead><tbody id="counts"></tbody></table>
  <p class="hint" id="total"></p>
  <div class="actions">
    <button id="exportBtn" class="primary" disabled data-i18n="btnExport"></button>
    <button id="clearBtn" disabled data-i18n="btnClear"></button>
  </div>
  <p class="hint" data-i18n="storageHint"></p>
</section>
</main>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";
import { T, LANGS } from "./i18n.js";

const WASM = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm";
const MODEL_LOCAL = "../models/hand_landmarker.task";
const MODEL_REMOTE = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const STORE_KEY = "lingora-collect-v1", LANG_KEY = "lingora-lang";
const FALLBACK = { signs: ["hello","thank_you","yes","no","please_repeat","i_want_work","my_name","wait"].map(id => ({ id, label: { en: id.replace(/_/g, " ") } })),
  none: { id: "none", label: { en: "None (not a sign)" }, hint: { en: "Relaxed hands, random shapes, transitions, signs outside the vocabulary." } } };

const $ = (id) => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d");
let cfg = FALLBACK, samples = [], landmarker = null, stream = null, recording = null, busy = false, lastTake = null, lastVideoTime = -1, lastSampleT = 0;
let lang = pickLang(), lastSay = null;

function pickLang() {
  try { const s = localStorage.getItem(LANG_KEY); if (LANGS[s]) return s; } catch { /* ignore */ }
  const n = (navigator.language || "en").slice(0, 2).toLowerCase();
  return LANGS[n] ? n : "en";
}
const t = (k, v = {}) => String((T[lang] && T[lang][k]) ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (_, n) => (v[n] ?? ""));
const pick = (o) => (typeof o === "string" ? o : (o && (o[lang] || o.en)) || "");
const signLabel = (id) => { const s = [...cfg.signs, cfg.none].find((x) => x.id === id); return s ? pick(s.label) : id; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function say(key, kind = "", vars = {}) { lastSay = { key, kind, vars }; renderSay(); }
function renderSay() { const s = $("status"); s.textContent = lastSay ? t(lastSay.key, lastSay.vars) : ""; s.className = lastSay ? lastSay.kind : ""; }

function applyLang() {
  document.documentElement.lang = lang; document.title = t("appTitle");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  const prev = $("sign").value, all = [...cfg.signs, cfg.none];
  $("sign").innerHTML = all.map((s) => `<option value="${s.id}">${pick(s.label)}</option>`).join("");
  if (prev) $("sign").value = prev;
  showHint(); renderSay(); refresh();
  if (!stream) $("stageMsg").textContent = t("camOff");
}
function initLangSelect() {
  const sel = $("lang");
  sel.innerHTML = Object.entries(LANGS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  sel.value = lang;
  sel.onchange = () => { lang = sel.value; try { localStorage.setItem(LANG_KEY, lang); } catch { /* ignore */ } applyLang(); };
}

let signsOk = false;
async function loadConfig() {
  for (const url of ["../signs.json", "./signs.json"]) {
    try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) { cfg = await r.json(); signsOk = true; return; } } catch { /* try the next place */ }
  }
}
function showHint() {
  $("signHint").textContent = $("sign").value === cfg.none.id ? pick(cfg.none.hint) : t("signHint");
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(samples)); }
  catch { say("autosaveFail", "warn"); }
}
function restore() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); if (Array.isArray(s) && s.length) { samples = s; say("restored", "ok", { n: s.length }); } } catch { /* ignore */ }
}
function ready() {
  const idOk = /^[A-Za-z0-9_-]{2,16}$/.test($("signer").value.trim());
  return { consent: $("consent").checked, idOk, cam: !!landmarker && !!stream };
}
function refresh() {
  const r = ready();
  $("recBtn").disabled = busy || !signsOk || !(r.consent && r.idOk && r.cam);
  $("signsWarn").hidden = signsOk;
  $("undoBtn").disabled = busy || !lastTake;
  $("exportBtn").disabled = busy || samples.length === 0;
  $("clearBtn").disabled = busy || samples.length === 0;
  $("startBtn").disabled = busy || !!stream;
  const sm = {}, per = {};
  for (const s of samples) { sm[s.sign] = (sm[s.sign] || 0) + 1; (per[s.sign] ||= {})[s.signer_id] = (per[s.sign][s.signer_id] || 0) + 1; }
  $("counts").innerHTML = [...cfg.signs, cfg.none].map((s) => `<tr><td>${pick(s.label)}</td><td>${sm[s.id] || 0}</td><td>${Object.entries(per[s.id] || {}).map(([k, v]) => `${k}: ${v}`).join(", ") || "-"}</td></tr>`).join("");
  $("total").textContent = t("total", { n: samples.length, k: new Set(samples.map((s) => s.signer_id)).size });
}

async function pickModel() {
  try { const r = await fetch(MODEL_LOCAL, { method: "HEAD" }); if (r.ok) return MODEL_LOCAL; } catch { /* fall through */ }
  return MODEL_REMOTE;
}
async function start() {
  busy = true; refresh(); say("starting");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    video.srcObject = stream; await video.play();
    $("stage").style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
  } catch (e) {
    stream = null; busy = false; refresh();
    return say("errCamera", "err");
  }
  try {
    const fileset = await FilesetResolver.forVisionTasks(WASM);
    const modelAssetPath = await pickModel();
    const mk = (delegate) => HandLandmarker.createFromOptions(fileset, { baseOptions: { modelAssetPath, delegate }, runningMode: "VIDEO", numHands: 2 });
    try { landmarker = await mk("GPU"); } catch { landmarker = await mk("CPU"); }
  } catch (e) {
    stream.getTracks().forEach((x) => x.stop()); stream = null; busy = false; refresh();
    return say("errModel", "err");
  }
  busy = false; $("stageMsg").textContent = t("showHand"); say("ready", "ok"); refresh(); requestAnimationFrame(loop);
}

function bestHand(res) {
  let b = -1, score = -1;
  (res.landmarks || []).forEach((_, i) => { const sc = res.handedness?.[i]?.[0]?.score ?? 0; if (sc > score) { score = sc; b = i; } });
  return b < 0 ? null : { i: b, score, label: res.handedness[b][0].categoryName };
}
function draw(lm) {
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!lm) return;
  ctx.lineWidth = 3; ctx.strokeStyle = "#7FD1C7"; ctx.fillStyle = "#B9F0E8";
  for (const c of HandLandmarker.HAND_CONNECTIONS || []) {
    ctx.beginPath(); ctx.moveTo(lm[c.start].x * canvas.width, lm[c.start].y * canvas.height); ctx.lineTo(lm[c.end].x * canvas.width, lm[c.end].y * canvas.height); ctx.stroke();
  }
  for (const p of lm) { ctx.beginPath(); ctx.arc(p.x * canvas.width, p.y * canvas.height, 4, 0, 7); ctx.fill(); }
}
function loop() {
  if (!stream) return;
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const now = performance.now();
    const res = landmarker.detectForVideo(video, now);
    const h = bestHand(res);
    draw(h ? res.landmarks[h.i] : null);
    $("stageMsg").textContent = recording ? t("recordingStage") : h ? t("handDetected", { label: h.label, score: (h.score * 100).toFixed(0) }) : t("noHand");
    if (recording && h && now - lastSampleT >= 100) {
      lastSampleT = now;
      recording.frames.push({ sign: recording.sign, signer_id: recording.signer, signer_type: recording.type, consent: true,
        hand: h.label, hand_score: +h.score.toFixed(3),
        landmarks: res.landmarks[h.i].map((p) => [+p.x.toFixed(5), +p.y.toFixed(5), +p.z.toFixed(5)]),
        aspect: +(video.videoWidth / video.videoHeight).toFixed(4), device: recording.device, lighting: recording.lighting,
        distance: recording.distance, take_id: recording.id, created: new Date().toISOString() });
    }
  }
  requestAnimationFrame(loop);
}

async function record() {
  const r = ready();
  if (!signsOk) return say("signsMissing", "err");
  if (!r.consent) return say("needConsent", "warn");
  if (!r.idOk) return say("needCode", "warn");
  busy = true; refresh();
  const sign = $("sign").value;
  const take = { id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), sign, signer: $("signer").value.trim().toUpperCase(),
    type: $("signerType").value, device: $("device").value.trim(), lighting: $("lighting").value, distance: $("distance").value, frames: [] };
  for (let i = 2; i > 0; i--) { say("getReady", "", { i }); await sleep(1000); }
  lastSampleT = 0; recording = take; say("recordingStatus");
  await sleep(3000);
  recording = null; busy = false;
  if (take.frames.length < 8) say("discarded", "warn");
  else { samples.push(...take.frames); lastTake = take.id; persist(); say("saved", "ok", { n: take.frames.length, sign: signLabel(sign) }); }
  refresh();
}
function undo() {
  if (!lastTake) return;
  const n = samples.length; samples = samples.filter((s) => s.take_id !== lastTake); lastTake = null; persist();
  say("removed", "ok", { n: n - samples.length }); refresh();
}
function exportJson() {
  const blob = new Blob([JSON.stringify({ format: "lingora-landmarks-v1", exported: new Date().toISOString(), samples })], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `lingora-landmarks-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); say("exported", "ok");
}
function clearAll() {
  if (!confirm(t("confirmClear"))) return;
  samples = []; lastTake = null; persist(); say("cleared", "ok"); refresh();
}

$("startBtn").onclick = start; $("recBtn").onclick = record; $("undoBtn").onclick = undo;
$("exportBtn").onclick = exportJson; $("clearBtn").onclick = clearAll;
$("sign").onchange = showHint; ["consent", "signer"].forEach((id) => $(id).addEventListener("input", refresh));
addEventListener("pagehide", () => stream && stream.getTracks().forEach((x) => x.stop()));
await loadConfig(); initLangSelect(); applyLang(); restore(); refresh();
</script>
</body>
</html>
